<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800;900&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        darkMode: "class",

          extend: {
            "colors": {
                    "inverse-on-surface": "#313031",
                    "surface-dim": "#131314",
                    "surface-container-low": "#1c1b1c",

                    "on-tertiary-fixed": "#23005b",

                    "on-surface": "#e5e2e3",
                    "tertiary-fixed-dim": "#d1bcff",
                    "on-primary-fixed-variant": "#004f58",
                    "background": "#131314",
                    "tertiary-container": "#d9c8ff",
                    "outline": "#849396",
                    "on-background": "#e5e2e3",
                    "error-container": "#93000a",
                    "on-primary-fixed": "#001f24",
                    "surface-container-high": "#2a2a2b",
                    "primary-container": "#00e5ff",
                    "surface-container-highest": "#353436",
                    "on-tertiary-fixed-variant": "#5700c9",
                    "on-error": "#690005",
                    "secondary-fixed-dim": "#31e192",
                    "surface-variant": "#353436",
                    "on-error-container": "#ffdad6",
                    "on-primary": "#00363d",
                    "surface-container": "#201f20",
                    "secondary-fixed": "#59feac",
                    "primary-fixed-dim": "#00daf3",
                    "on-surface-variant": "#bac9cc",

                    "surface-bright": "#3a393a",

                    "on-tertiary": "#3c0090",
                    "secondary": "#43ed9c",
                    "outline-variant": "#3b494c",
                    "on-secondary-fixed": "#002111",
                    "inverse-surface": "#e5e2e3",
                    "surface": "#131314",
                    "on-tertiary-container": "#6c00f7",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "gutter": "24px",
                    "unit": "8px",
                    "sidebar-width": "280px",
                    "player-height": "96px",
                    "container-margin": "32px"
            },
            "fontFamily": {
                    "body-lg": ["Manrope"],
                    "body-md": ["Manrope"],
                    "headline-lg": ["Epilogue"],
                    "label-sm": ["Manrope"],

<style>
        .glass-card {
            background: rgba(32, 31, 32, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(186, 201, 204, 0.1);
        }
        .animated-wave-bg {
            background-color: #050505;
            background-image: radial-gradient(at 50% 100%, rgba(0, 229, 255, 0.08) 0%, transparent 50%),
                              radial-gradient(at 0% 0%, rgba(67, 237, 156, 0.05) 0%, transparent 40%);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .cyan-glow-focus:focus {
            outline: none;
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-gutter overflow-hidden">
<!-- Background Wave Visual -->
<div class="animated-wave-bg">
<div class="absolute inset-0 opacity-20">
<svg class="w-full h-full" viewbox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<path d="M0,500 C200,400 300,600 500,500 C700,400 800,600 1000,500 L1000,1000 L0,1000 Z" fill="url(#wave-grad)" opacity="0.5">
</path>
<defs>
<lineargradient id="wave-grad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#00e5ff;stop-opacity:0.2"></stop>
<stop offset="100%" style="stop-color:#43ed9c;stop-opacity:0.1"></stop>
</lineargradient>
</defs>
</svg>
</div>
</div>
<!-- Login Shell -->
<main class="w-full max-w-[440px] z-10">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10 text-center">
<div class="w-16 h-16 bg-gradient-to-tr from-primary-container to-secondary rounded-xl flex items-center justify-center mb-4 shadow-[0_0_30px_rgba(0,229,255,0.3)]">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-weight="fill">graphic_eq</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-white tracking-tighter">SONIC NOIR</h1>
<p class="font-body-md text-on-surface-variant mt-2">Enter the nocturnal sanctuary of sound.</p>
</div>
<!-- Center Login Card -->
<div class="glass-card rounded-[24px] p-10 shadow-2xl relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container via-secondary to-primary-container opacity-50"></div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-surface-container-highest/50 border border-outline-variant/30 rounded-xl py-4 pl-12 pr-4 text-white font-body-md cyan-glow-focus transition-all duration-300 placeholder:text-outline/50" id="email" placeholder="curator@sonicnoir.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-outline hover:text-primary-container transition-colors duration-200" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-container-highest/50 border border-outline-variant/30 rounded-xl py-4 pl-12 pr-12 text-white font-body-md cyan-glow-focus transition-all duration-300 placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-body-lg py-4 rounded-xl flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(0,229,255,0.2)] hover:shadow-[0_12px_24px_rgba(0,229,255,0.3)] hover:-translate-y-1 active:scale-[0.98] transition-all duration-300" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<!-- Social Logins -->
</div>
<!-- Footer Navigation -->
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                New to the lounge? 
                <a class="text-secondary font-semibold hover:text-primary transition-colors duration-200 ml-1 border-b border-secondary/0 hover:border-secondary/100" href="#">Create an account</a>
</p>
</div>
</main>
<!-- Decorative Corner Element -->
<div class="fixed bottom-12 right-12 opacity-40 hidden lg:block">
<div class="flex items-end gap-1 h-12">
<div class="w-1 bg-primary-container h-8 rounded-full"></div>
<div class="w-1 bg-primary-container h-12 rounded-full"></div>
<div class="w-1 bg-secondary h-6 rounded-full"></div>
<div class="w-1 bg-primary-container h-10 rounded-full"></div>
<div class="w-1 bg-secondary h-4 rounded-full"></div>
</div>
</div>
<!-- Background Imagery for context -->
<div class="sr-only">
<img data-alt="A moody, high-fidelity digital art background of a dark music studio at night. The scene is illuminated by soft neon cyan and mint green lights emanating from modular synthesizers and sound panels. Deep obsidian shadows fill the room, creating an immersive nocturnal atmosphere. The visual style is sleek and minimalist, with a hint of glowing music wave visualizations floating in the air." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCX4Y1bwBmb5k3bU7NiMXCwZiBdALs-BzQulrA2Y4x9dt42TmIeC_HV8zbiMi2UYfysQis7aNWEhnYXqYaJkMwDttzGjVfMXzc_6_DYXGbD3aYCMErwnQV0HsdkdwTN2nntXELckYRyqAxfCjWL1aAEwPgOL8H5efhWLVb9yBOghaZ9DdNewuS0PqaNNOFINy1Q4YGeK7kZCcSoowNklssYxH7WSqROF9qZ1bcvnxhR-4B7GbZMGhVvx28BsjckrWzt6wONE2PG5lYK"/>
</div>
</body></html>
